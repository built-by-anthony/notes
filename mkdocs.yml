site_name: tony-notes
site_url: https://built-by-anthony.github.io/notes/
theme: 
    name: material
    features: 
        - navigation.indexes  # Lets a section's own `index.md` serve as that section;s landing page.
        - search.suggest      # Shows an inline completion of the likely query as you type in search. 
        - content.code.copy   # Adds a copy-to-clipboard button to every code block. 
    palette:
      # Dark mode, listed first so it's the fallback when no preference is reported.
      - media: "(prefers-color-scheme: dark)"
        scheme: slate 
        toggle: { icon: material/weather-sunny, name: Light mode } # Button that switches to light.
      # Light mode
      - media: "(prefers-color-scheme: light)"
        scheme: default
        toggle: { icon: material/weather-night, name: Dark mode } # Button that switches back to dark.
nav:
  - Home: index.md
  - Books:
    - Designing Data-Intensive Applications:
        - books/designing-data-intensive-applications/ch01-tradeoffs-data-systems-arch.md
        - books/designing-data-intensive-applications/ch02-defining-non-functional-requirements.md
        - books/designing-data-intensive-applications/ch03-data-models-query-languges.md
    - Vibe Coding:
        - books/vibe-coding/introduction.md
        - "Part 1: Why Vibe Code?":
            - Introduction: books/vibe-coding/part-1-why-vibe-code/introduction.md
            - "Chapter 1: The Future is Here": books/vibe-coding/part-1-why-vibe-code/ch01-the-future-is-here.md
            - "Chapter 2: No Winners, Only Survivors": books/vibe-coding/part-1-why-vibe-code/ch02-programming-no-winners-only-survivors.md
            - "Chapter 3: The Value Vibe Coding Brings": books/vibe-coding/part-1-why-vibe-code/ch03-the-value-vibe-coding-brings.md
            - "Chapter 4: The Dark Side: When Vibe Coding Goes Horribly Wrong": books/vibe-coding/part-1-why-vibe-code/ch04-the-dark-side.md
            - "Chapter 7: What Skills to Learn": books/vibe-coding/part-1-why-vibe-code/ch07-what-skills-to-learn.md
        - "Part 2: The Theory and Practice of Vibe Coding": 
            - Introduction: books/vibe-coding/part-2-the-theory-and-practice-of-vibe-coding/introduction.md
            - "Chapter 8: Welcome to the Vibe Coding Kitchen": books/vibe-coding/part-2-the-theory-and-practice-of-vibe-coding/ch08-welcome-vibe-coding-kitchen.md
            - "Chapter 9 Understanding Your Kitchen and AI Collaborators": books/vibe-coding/part-2-the-theory-and-practice-of-vibe-coding/ch09-understand-your-collabs.md
    - AI Engineering: 
        - books/ai-engineering/ch01-introduction-building-ai.md
  - Certifications: 
    - AWS Certifications:
        - AWS Certified Data Engineer Associate:
            - "AWS Certified Data Engineer Associate Study Guide - O'Reilly":
                - "Chapter 1. Certification Essentials": books/aws-data-eng-oreilly/ch01-cert-essentials.md
                - "Chapter 2. Prerequisite Knowledge for Aspiring Data Engineers": books/aws-data-eng-oreilly/ch02-pre-knowledge.md
                - "Chapter 3. Overview of AWS Analytics and Auxiliary Services": books/aws-data-eng-oreilly/ch03-overview-aws-analytics-aux.md
                - "Chapter 4. Data Ingestion and Transformation": books/aws-data-eng-oreilly/ch04-data-ingestion-transformation.md
    - Anthropic Claude Certifications: 
        - Claude Certified Developer:
            - "Claude Certified Developer - Foundations Prep Course": 
                - "MSO Foundations": claude-certs/claude-certified-developer/foundations-prep-course/mso-foundations.md
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition                                   # Enables !!! note / !!! warning callout blocks.
  - footnotes                                    # Turns [^1] references into linked footnotes at the page bottom.
  - toc: { permalink: true }                     # Adds a clickable anchor beside every heading.
  - pymdownx.highlight                           # Syntax-highlights fenced code blocks via Pygments at build time.
  - pymdownx.superfences                         # Nested/custom fences; required for highlight to work on all blocks.
  - pymdownx.details                             # Makes amonitions collapsible via ??? / ???+ blocks
  - pymdownx.tasklist: { custom_checkbox: true } # Renders - [ ] / - [ x ] lsits as styled checkboxes. 
  - pymdownx.blocks.caption                      # Wraps an image + caption into <figure>/<figcaption>
  - attr_list                                    # Lets you attach { width= } to iamges and links.
